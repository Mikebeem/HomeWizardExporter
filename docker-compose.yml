services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: homewizard_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homewizard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Database password - MUST be set via environment variable or .env file
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set via POSTGRES_PASSWORD environment variable}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HomeWizard Exporter Application
  exporter:
    build: .
    container_name: homewizard_exporter
    environment:
      # HomeWizard P1 Meter IP address - MUST be set via environment variable or .env file
      HOMEWIZARD_HOST: ${HOMEWIZARD_HOST:?HomeWizard meter IP address must be set via HOMEWIZARD_HOST environment variable}
      # Database connection
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-homewizard}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set via POSTGRES_PASSWORD environment variable}
      # Poll interval in seconds (default: 30)
      POLL_INTERVAL: ${POLL_INTERVAL:-30}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
